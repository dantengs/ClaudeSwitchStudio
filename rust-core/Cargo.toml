[package]
name = "claude-switch-core"
version = "0.4.3-preview"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs2 = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
