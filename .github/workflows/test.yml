name: Windows fixture tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Python synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Rust synthetic fixtures
        run: cargo test --locked --manifest-path rust-core/Cargo.toml
      - name: PowerShell preference fixtures
        shell: powershell
        run: ./tests/test-ui-preferences.ps1
